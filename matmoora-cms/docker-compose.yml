# Production stack — TECH_SPEC §16.2.
# Secrets are file-mounted from ./secrets (git-ignored, provisioned separately).
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    volumes:
      - db_data:/var/lib/mysql
    secrets: [db_password, db_root_password]

  wordpress:
    image: wordpress:6.5-php8.2-fpm-alpine
    restart: unless-stopped
    depends_on: [db]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        define('MATMOORA_REVALIDATE_URL', getenv('MATMOORA_REVALIDATE_URL'));
        define('MATMOORA_REVALIDATE_SECRET', getenv('MATMOORA_REVALIDATE_SECRET'));
        define('MATMOORA_MEILI_HOST', getenv('MATMOORA_MEILI_HOST'));
        define('MATMOORA_MEILI_ADMIN_KEY', getenv('MATMOORA_MEILI_ADMIN_KEY'));
    volumes:
      - ./wp-content:/var/www/html/wp-content
      - wp_uploads:/var/www/html/wp-content/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [wordpress]

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY_FILE: /run/secrets/meili_master_key
    volumes:
      - meili_data:/meili_data
    ports: ["127.0.0.1:7700:7700"] # Localhost only — never exposed externally.
    secrets: [meili_master_key]

volumes:
  db_data:
  wp_uploads:
  caddy_data:
  caddy_config:
  meili_data:

secrets:
  db_password:
    file: ./secrets/db_password
  db_root_password:
    file: ./secrets/db_root_password
  meili_master_key:
    file: ./secrets/meili_master_key
