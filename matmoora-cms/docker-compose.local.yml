# Local development stack — TECH_SPEC §16.6.
# Plain passwords and an apache image for a simpler local loop. Not for prod.
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.5-php8.2-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: root
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('MATMOORA_REVALIDATE_URL', getenv('MATMOORA_REVALIDATE_URL'));
        define('MATMOORA_REVALIDATE_SECRET', getenv('MATMOORA_REVALIDATE_SECRET'));
        define('MATMOORA_MEILI_HOST', getenv('MATMOORA_MEILI_HOST'));
        define('MATMOORA_MEILI_ADMIN_KEY', getenv('MATMOORA_MEILI_ADMIN_KEY'));
    volumes:
      - ./wp-content:/var/www/html/wp-content

  meilisearch:
    image: getmeili/meilisearch:v1.10
    environment:
      MEILI_MASTER_KEY: dev-master-key
    ports: ["7700:7700"]

volumes:
  db_data:
