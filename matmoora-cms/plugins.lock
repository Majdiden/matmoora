# plugins.lock — manually maintained list of WordPress plugins in use.
#
# Rule (CLAUDE.md): never enable a plugin without adding it here.
#
# Columns: slug | purpose | update-policy | status
#   auto      = auto-updates enabled (core + minor)
#   manual    = updated by hand after a content-fetch smoke test
#   shipped   = loaded as a mu-plugin from this repo
#   planned   = decided but not yet installed on any environment

# ----- GraphQL surface -----
wpgraphql                   | Public GraphQL API surface                   | manual   | planned
advanced-custom-fields-pro  | Custom fields (ACF Pro)                      | auto     | planned
wpgraphql-acf               | Exposes ACF fields through WPGraphQL         | manual   | planned

# ----- SEO -----
wordpress-seo               | Yoast SEO                                    | auto     | planned
add-wpgraphql-seo           | Exposes Yoast data through WPGraphQL         | auto     | planned

# ----- Multilingual (TECH_SPEC decision: WPML) -----
sitepress-multilingual-cms  | WPML — multilingual                          | manual   | planned
wp-graphql-wpml             | Exposes WPML translations through WPGraphQL  | manual   | planned

# ----- Security & comments -----
akismet                     | Comment spam filtering                       | auto     | planned
wordfence                   | WAF + 2FA enforcement for admin accounts     | auto     | planned

# ----- Forms (Phase 3 pick) -----
